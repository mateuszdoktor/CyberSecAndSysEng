receivers:

  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:

  batch:

exporters:

  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"

  otlp_http/tempo:
    endpoint: http://tempo:4318

extensions:

  health_check:
    endpoint: :13133

service:

  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8889

  pipelines:

    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/tempo]

  extensions: [health_check]